[package]
name = "melbi-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
include = ["src/**/*", "../zed/languages/melbi/highlights.scm"]

[[bin]]
name = "melbi"
path = "src/main.rs"

[dependencies]
melbi.workspace = true
melbi-core.workspace = true
melbi-fmt.workspace = true
bumpalo.workspace = true
reedline = { version = "0.49.0", features = ["libc"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight = "0.26"
tree-sitter-melbi.workspace = true
nu-ansi-term = "0.50"
dirs = "6.0.0"
logos = "0.16.1"
pest.workspace = true
similar = "3.1"
open = "5"
urlencoding = "2"
shlex = "2"
crossterm = "0.29"

[dev-dependencies]
assert_cmd = "2.0"
expect-test.workspace = true
predicates = "3.1"
tempfile = "3.15"
termlens = "0.5"
url = "2"
insta = "1"

[lints]
workspace = true
