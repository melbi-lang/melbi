[package]
name = "melbi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
std = []
experimental_maps = []

[dependencies]
melbi-macros.workspace = true
allocator-api2 = "0.2.21" # Match bumpalo and hashbrown
bumpalo.workspace = true
hashbrown.workspace = true
lazy_static = "1.4"
pest.workspace = true
pest_derive.workspace = true
static_assertions.workspace = true
serde.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
smallvec.workspace = true
ecow = { version = "0.2.6", default-features = false }
tracing.workspace = true

[build-dependencies]
pest_generator = { version = "^2.7", default-features = false }

[dev-dependencies]
once_cell.workspace = true
pretty_assertions.workspace = true
criterion.workspace = true
cel-interpreter = "0.10"
tracing-subscriber.workspace = true

[[bench]]
name = "evaluator"
harness = false

[[bench]]
name = "type_manager"
harness = false

[[bench]]
name = "function_dispatch"
harness = false

[[bench]]
name = "function_dispatch_simple"
harness = false

[lib]
proc-macro = false

[lints]
workspace = true

