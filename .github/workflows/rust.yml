name: Rust

on:
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            deps: 'musl-tools gcc-multilib'
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            deps: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            deps: 'musl-tools'
          - target: x86_64-apple-darwin
            os: macos-latest
            deps: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            deps: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        if: matrix.deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true

      - name: Build binaries
        run: cargo build -p melbi-cli -p melbi-lsp --release --verbose --target ${{ matrix.target }}

      - name: Prepare binaries
        shell: bash
        run: |
          mkdir -p dist
          BINARY_DIR=target/${{ matrix.target }}/release
          for bin in melbi melbi-lsp; do
            src="$BINARY_DIR/$bin"
            if [ -f "$src" ]; then
              cp "$src" "dist/${bin}-${{ matrix.target }}"
              strip "dist/${bin}-${{ matrix.target }}"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create pre-alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-alpha
          name: Pre-Alpha Build
          body: |
            This is a pre-alpha development build of Melbi. Binaries are provided for testing purposes only and may be unstable.

            ### Included binaries

            - `melbi` — CLI tool (eval, run, check, fmt, repl, completions)
            - `melbi-lsp` — Language server for editor integration

            Download the appropriate binary for your platform from the assets below.
          prerelease: true
          files: dist/**/*
