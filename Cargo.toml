[workspace]
members = [
    # Packages published as crates on crates.io
    "cli", # CLI tool for evaluating, checking, formatting, REPL and more.
    "core", # Parser, type-checker, interpreter, bytecode compiler, VM, types,
            # values, standard library, and more. (no_std compatible).
    "fmt",  # Formatting library shared by melbi-cli and melbi-lsp.
    "lsp",  # Language Server Protocol implementation.
    "macros", # Macros for the Melbi language.

    # Independent packages (might become their own crates on crates.io)
    "support/small-str",
    "support/teeny-vec",
    "support/thin-ref",

    # Other packages.
    "zed", # Zed editor extension (to be published to Zed's registry)
    "playground/worker", # WebAssembly worker for the playground
    "parser", # WIP: new parser
    "types", # WIP: new type foundation based on "builder traits"
    "values", # WIP: new value foundation based on "builder traits"
]

[workspace.lints.rust]
invalid_reference_casting = "warn"

[workspace.lints.clippy]
# ### ENABLES: ###
all = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# restriction = { level = "warn", priority = -1 }
# pedantic = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
branches_sharing_code = "warn"
cast_lossless = "warn"
char_lit_as_u8 = "warn"
clone_on_ref_ptr = "warn"
decimal_literal_representation = "warn"
empty_drop = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
fn_to_numeric_cast = "warn"
fn_to_numeric_cast_any = "warn"
fn_to_numeric_cast_with_truncation = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
iter_without_into_iter = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
non_std_lazy_statics = "warn"
ptr_as_ptr = "warn"
redundant_test_prefix = "warn"
unnecessary_cast = "warn"
used_underscore_binding = "warn"

# TODO: consider enabling the lint warnings below.

# # Cast-related warnings:
# cast_possible_truncation = "warn"
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_sign_loss = "warn"

# needless_pass_by_value = "warn"
# unreadable_literal = "warn"

# ### DISABLES: ###

# If new high-noise / low-utility lints appear, then disable them.
# Important: keep useful lints enabled!
module_inception = "allow"
approx_constant = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
inline_always = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nilton Volpato <nilton@volpa.to>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
melbi = { version = "0.1.0" }
melbi-core = { version = "0.1.0" }
melbi-types = { version = "0.1.0" }
melbi-lsp = { version = "0.1.0" }
melbi-cli = { version = "0.1.0" }
melbi-fmt = { version = "0.1.0" }
melbi-macros = { version = "0.1.0" }
melbi-small-str = { version = "0.1.0" }
melbi-teeny-vec = { version = "0.1.0" }
melbi-thin-ref = { version = "0.1.0" }
tree-sitter-melbi = { path = "tree-sitter" }

bumpalo = { version = "3.19.0", features = ["allocator-api2"] }
criterion = { version = "0.8", features = ["html_reports"] }
expect-test = "1.5"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more", "allocator-api2", "equivalent"] }
once_cell = { version = "1.21.3" }
pest = { version = "^2.8.0", default-features = false }
pest_derive = { version = "^2.8.0", default-features = false }
pretty_assertions = "1.4"
serde = { version = "1.0", features = ["derive"] }
smallvec = { version = "1.15.1", features = ["const_new", "union"] }
static_assertions = { version = "1.1.0" }
thiserror = { version = "2.0.17", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.26"

[package]
name = "melbi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ariadne = "0.6.0"
bumpalo.workspace = true
melbi-core.workspace = true
melbi-fmt = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
expect-test.workspace = true
pretty_assertions.workspace = true
once_cell.workspace = true
indoc = "2"
pest.workspace = true

[lib]
proc-macro = false

[features]
default = ["fmt"]
fmt = ["dep:melbi-fmt"]

[patch.crates-io]
melbi = { path = "." }
melbi-core = { path = "core" }
melbi-types = { path = "types" }
melbi-lsp = { path = "lsp" }
melbi-cli = { path = "cli" }
melbi-fmt = { path = "fmt" }
melbi-macros = { path = "macros" }
melbi-small-str = { path = "support/small-str" }
melbi-teeny-vec = { path = "support/teeny-vec" }
melbi-thin-ref = { path = "support/thin-ref" }

[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%

[profile.dev]
incremental = true          # Improves re-compile times
